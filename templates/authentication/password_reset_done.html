<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Reset Sent | Vybe</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

  <!-- Background Image -->
  <div 
    class="absolute inset-0 bg-cover bg-center" 
    id="background" 
    style="background-image: url('https://wallpaperaccess.com/full/3034392.jpg');"
  ></div>

  <!-- Dark Overlay -->
  <div class="absolute inset-0 bg-black bg-opacity-70"></div>

  <!-- Card Container -->
  <div 
    class="relative z-10 max-w-md w-full p-8 bg-white bg-opacity-10 backdrop-blur-md rounded-lg border border-gray-600 shadow-xl text-center"
    id="form-card"
  >
    <h1 class="text-3xl font-bold mb-6">Check Your Email 📩</h1>
    <p class="mb-4 text-gray-300 text-lg">
      We've sent you instructions to reset your password.
    </p>
    <p class="text-gray-400 text-sm mb-6">
      If you don't see it soon, check your spam folder.
    </p>

    <!-- Go to Gmail Button -->
    <a href="https://mail.google.com" target="_blank" 
       class="inline-block px-6 py-3 rounded-full bg-blue-600 hover:bg-blue-700 transition-all font-semibold text-white shadow-md">
      Open Gmail
    </a>
  </div>

  <script>
    // Animate background slowly zooming and moving
    gsap.to("#background", {
      scale: 1.1,
      y: "-5%",
      duration: 10,
      ease: "power1.inOut",
      repeat: -1,
      yoyo: true
    });

    // Animate card entrance
    gsap.from("#form-card", {
      y: 100,
      opacity: 0,
      scale: 0.8,
      duration: 1.5,
      ease: "elastic.out(1, 0.5)"
    });

    // Optional subtle parallax rotation on mouse move
    document.addEventListener("mousemove", (e) => {
      let x = (e.clientX / window.innerWidth - 0.5) * 10;
      let y = (e.clientY / window.innerHeight - 0.5) * 10;
      gsap.to("#form-card", {
        rotationY: x,
        rotationX: -y,
        ease: "power1.out",
        duration: 0.5
      });
    });
  </script>
  
</body>
</html>
