<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Your Password | Vybe</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    /* Input styles */
    form input[type="password"],
    form input[type="text"],
    form input[type="email"],
    form input[type="submit"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 16px;
      font-weight: 500;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: none;
      outline: none;
    }

    form input[type="password"]::placeholder,
    form input[type="text"]::placeholder,
    form input[type="email"]::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    form input[type="password"]:focus,
    form input[type="text"]:focus,
    form input[type="email"]:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: #f87171; /* Tailwind's red-400 */
      box-shadow: 0 0 8px rgba(248, 113, 113, 0.7);
    }

    form input[type="submit"] {
      background: #ef4444;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
    }

    form input[type="submit"]:hover {
      background: #b91c1c;
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(185, 28, 28, 0.8);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

  <!-- Background Image -->
  <div
    id="background"
    class="absolute inset-0 bg-cover bg-center"
    style="background-image: url('https://wallpaperaccess.com/full/3034392.jpg');"
  ></div>

  <!-- Dark Overlay -->
  <div class="absolute inset-0 bg-black bg-opacity-70"></div>

  <!-- Form Card -->
  <div
    id="form-card"
    class="relative z-10 max-w-md w-full p-10 bg-white bg-opacity-10 backdrop-blur-md rounded-xl border border-gray-600 shadow-lg text-center"
  >
    <h1 class="text-4xl font-extrabold mb-6">Reset Password 🔒</h1>
    <p class="mb-8 text-gray-300 text-lg">Enter your new password below.</p>

    <form method="post" class="space-y-6">
      {% csrf_token %}
      {{ form }}

      <input
        type="submit"
        value="Change my password"
        class="w-full py-3 rounded-lg bg-red-600 hover:bg-red-700 transition-transform transform hover:scale-105 cursor-pointer text-white font-semibold shadow-md shadow-red-600/50"
      />
    </form>
  </div>

  <script>
    gsap.to("#background", {
      scale: 1.1,
      y: "-5%",
      duration: 10,
      ease: "power1.inOut",
      repeat: -1,
      yoyo: true,
    });

    gsap.from("#form-card", {
      y: 100,
      opacity: 0,
      scale: 0.85,
      duration: 1.5,
      ease: "elastic.out(1, 0.5)",
    });

    document.addEventListener("mousemove", (e) => {
      let x = (e.clientX / window.innerWidth - 0.5) * 10;
      let y = (e.clientY / window.innerHeight - 0.5) * 10;
      gsap.to("#form-card", {
        rotationY: x,
        rotationX: -y,
        ease: "power1.out",
        duration: 0.5,
      });
    });
  </script>

</body>
</html>
