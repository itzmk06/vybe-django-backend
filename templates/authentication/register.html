<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Vybe</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden">

<!-- Background Image -->
<div class="absolute inset-0 bg-cover bg-center" id="background" style="background-image: url('https://wallpaperaccess.com/full/3034392.jpg');"></div>
<!-- Dark Overlay -->
<div class="absolute inset-0 bg-black bg-opacity-70"></div>

<div id="form-card" class="relative z-10 w-full max-w-md p-8 bg-white bg-opacity-10 backdrop-blur-md rounded-lg border border-gray-600 shadow-xl">
  
  <h1 class="text-3xl font-bold mb-6 text-center">Register for Vybe</h1>

  <!-- Display Django messages -->
  {% if messages %}
    <ul class="mb-4 space-y-2">
      {% for message in messages %}
        <li class="text-center text-sm {% if message.tags == 'error' %}text-red-500{% else %}text-green-500{% endif %}">
          {{ message }}
        </li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}

    <!-- Username -->
    <input 
      type="text" 
      name="username" 
      placeholder="Username" 
      class="input w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-blue-400" 
      required
    >

    <!-- First Name -->
    <input 
      type="text" 
      name="first_name" 
      placeholder="First Name" 
      class="input w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-blue-400" 
      required
    >

    <!-- Last Name -->
    <input 
      type="text" 
      name="last_name" 
      placeholder="Last Name" 
      class="input w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-blue-400" 
      required
    >

    <!-- Email -->
    <input 
      type="email" 
      name="email" 
      placeholder="Email Address" 
      class="input w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-blue-400" 
      required
    >

    <!-- Password -->
    <input 
      type="password" 
      name="password1" 
      placeholder="Password" 
      class="input w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-blue-400" 
      required
    >

    <!-- Confirm Password -->
    <input 
      type="password" 
      name="password2" 
      placeholder="Confirm Password" 
      class="input w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-blue-400" 
      required
    >

    <!-- Submit Button -->
    <button 
      type="submit" 
      class="submit-btn w-full px-4 py-3 rounded-lg bg-red-600 hover:bg-red-700 transition-all transform hover:scale-105 hover:shadow-lg hover:shadow-red-500/50"
    >
      Get Started
    </button>

  </form>

  <p class="text-center text-gray-400 mt-4">
    Already have an account? 
    <a href="{% url 'login' %}" class="text-blue-400 hover:underline">Login here</a>
  </p>
</div>

<!-- GSAP Animations -->
<script>
  gsap.to("#background", {
    scale: 1.1,
    y: "-5%",
    duration: 10,
    ease: "power1.inOut",
    repeat: -1,
    yoyo: true
  });

  gsap.from("#form-card", {
    y: 100,
    opacity: 0,
    scale: 0.8,
    duration: 1.5,
    ease: "elastic.out(1, 0.5)"
  });

  gsap.from(".input", {
    opacity: 0,
    y: 30,
    duration: 1,
    ease: "back.out(1.7)",
    stagger: 0.2,
    delay: 0.5
  });

  gsap.to(".submit-btn", {
    scale: 1.05,
    repeat: -1,
    yoyo: true,
    ease: "sine.inOut",
    duration: 1.5,
    delay: 2
  });

  document.addEventListener("mousemove", (e) => {
    let x = (e.clientX / window.innerWidth - 0.5) * 10;
    let y = (e.clientY / window.innerHeight - 0.5) * 10;
    gsap.to("#form-card", {
      rotationY: x,
      rotationX: -y,
      ease: "power1.out",
      duration: 0.5
    });
  });
</script>

</body>
</html>
