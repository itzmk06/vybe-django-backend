{% autoescape off %}

<div style="font-family: 'Poppins', Arial, sans-serif; text-align: center; padding: 20px; background-color: #0f0f0f; color: #ffffff;">

  <!-- Vybe Logo -->
  <img src="https://cdn-icons-png.flaticon.com/128/10091/10091411.png" alt="Vybe Logo" style="width: 80px; height: 80px; margin-bottom: 20px;">

  <h2 style="font-size: 24px; margin-bottom: 20px;">Welcome to Vybe, {{ user.username }}!</h2>

  <p style="font-size: 16px; margin-bottom: 30px; line-height: 1.6;">
    Thank you for signing up. Please confirm your email address by clicking the button below.
  </p>

  <!-- Activation Button -->
  <a href="http://{{ domain }}{% url 'activate' uidb64=uid token=token %}" 
     style="display: inline-block; padding: 12px 24px; background-color: #009FFD; color: #ffffff; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 16px;">
    Activate My Account
  </a>

  <p style="margin-top: 30px; font-size: 14px; color: #bbbbbb; line-height: 1.4;">
    If you didn't create a Vybe account, you can ignore this email.
  </p>

  <p style="margin-top: 10px; font-size: 12px; color: #666666;">
    © 2025 Vybe. All rights reserved.
  </p>

</div>

{% endautoescape %}
