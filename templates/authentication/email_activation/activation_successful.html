<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Activated - Vybe</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden">

<!-- Background Image -->
<div class="absolute inset-0 bg-cover bg-center" id="background" style="background-image: url('https://wallpaperaccess.com/full/3034392.jpg');"></div>
<!-- Dark Overlay -->
<div class="absolute inset-0 bg-black bg-opacity-70"></div>

<div id="form-card" class="relative z-10 w-full max-w-md p-8 bg-white bg-opacity-10 backdrop-blur-md rounded-lg border border-gray-600 shadow-xl">
  
  <h1 class="text-3xl font-bold mb-6 text-center">Account Activated</h1>

  <p class="text-center text-lg mb-6">Your account has been successfully activated! You can now log in.</p>

  <!-- Login Button -->
  <a href="/login" class="w-full px-4 py-3 rounded-lg bg-red-600 hover:bg-red-700 transition-all transform hover:scale-105 hover:shadow-lg hover:shadow-red-500/50 text-center block">
    Login
  </a>

</div>

<!-- GSAP Animations -->
<script>
  gsap.to("#background", {
    scale: 1.1,
    y: "-5%",
    duration: 10,
    ease: "power1.inOut",
    repeat: -1,
    yoyo: true
  });

  gsap.from("#form-card", {
    y: 100,
    opacity: 0,
    scale: 0.8,
    duration: 1.5,
    ease: "elastic.out(1, 0.5)"
  });

  document.addEventListener("mousemove", (e) => {
    let x = (e.clientX / window.innerWidth - 0.5) * 10;
    let y = (e.clientY / window.innerHeight - 0.5) * 10;
    gsap.to("#form-card", {
      rotationY: x,
      rotationX: -y,
      ease: "power1.out",
      duration: 0.5
    });
  });
</script>

</body>
</html>
