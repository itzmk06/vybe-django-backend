<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Reset Complete | Vybe</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
      background: url('https://wallpaperaccess.com/full/3034392.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      position: relative;
    }
    /* Dark overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 48px 40px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    h1 {
      font-size: 2.75rem;
      font-weight: 700;
      margin-bottom: 24px;
    }
    p {
      font-size: 1.125rem;
      margin-bottom: 32px;
      color: #ddd;
      line-height: 1.4;
    }
    a {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 12px;
      background-color: #ff0000; /* solid red */
      color: white;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
      user-select: none;
    }
    a:hover {
      background-color: #cc0000;
      transform: scale(1.05);
    }
    a:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container" role="main" aria-label="Password reset success message">
    <h1>Password Updated! </h1>
    <p>Your password has been updated successfully. You can now log in using your new password!</p>
    <a href="{% url 'login' %}" role="button" aria-label="Return to login page">Return to Login</a>
  </div>

  <script>
    gsap.from(".container", {
      y: 100,
      opacity: 0,
      scale: 0.85,
      duration: 1.5,
      ease: "elastic.out(1, 0.5)"
    });

    gsap.to("a", {
      scale: 1.05,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut",
      duration: 1.5,
      delay: 2
    });
  </script>

</body>
</html>
